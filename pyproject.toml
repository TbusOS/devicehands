[project]
name = "devicehands"
version = "0.0.1"
description = "A hardware debugging toolkit for AI: debug real devices over serial and USB via MCP, CLI and Web."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "sky", email = "skyzhangbinghua@gmail.com" },
]
keywords = ["android", "adb", "debug", "llm", "mcp", "agent", "serial", "uart", "ssh"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]

# ─────────────────────────────────────────────
# Core runtime dependencies
# ─────────────────────────────────────────────
dependencies = [
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",

    # Config / serialization
    "pydantic>=2.6.0",
    "tomli-w>=1.0.0",              # tomllib 是 3.11 内置的读，写需额外
    "platformdirs>=4.0",            # 配置目录和数据目录按各系统惯例放(设计 5.10)

    # Transport-related
    "asyncssh>=2.14.0",             # SSH transport (方案 C/D/F)
    "pyserial>=3.5",                # Serial transport (方案 G)
    "pyserial-asyncio>=0.6",        # async 版

    # MCP
    "mcp>=0.9.0,<2",                # Model Context Protocol server(2.x 改了接口,见 mcp/server.py)

    # Web API (M2 才真正实现，但骨架一起装)
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",

    # 工具辅助
    "anyio>=4.0.0",                 # asyncio 兼容层
    "httpx>=0.26.0",                # 客户端 HTTP
]

[project.optional-dependencies]
# 可选的日志全文检索（M2 起用）
search = [
    "whoosh>=2.7.4",
]
# 可选的性能采集绘图（M2 perf 能力）
viz = [
    "pandas>=2.2.0",
    "plotly>=5.20.0",
]
# UI 自动化（M3）
ui = [
    "uiautomator2>=3.2.0",
]
# 所有可选
all = [
    "devicehands[search,viz,ui]",
]

# ─────────────────────────────────────────────
# Entry points
# ─────────────────────────────────────────────
[project.scripts]
devicehands = "devicehands.cli.main:main"
dhands = "devicehands.cli.main:main"
dhands-mcp = "devicehands.mcp.server:main"
dhands-hub = "devicehands.api.server:main"

[project.urls]
Homepage = "https://github.com/TbusOS/devicehands"
Documentation = "https://github.com/TbusOS/devicehands/tree/main/docs"
Repository = "https://github.com/TbusOS/devicehands"
Issues = "https://github.com/TbusOS/devicehands/issues"

# ─────────────────────────────────────────────
# Build system
# ─────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Local config files that hold real tokens / hosts. Named here, for the
# wheel and the sdist alike, because hatch did not apply .gitignore's
# `**/bench.conf` when this was set up (a bench-py/bench.conf in the
# working tree went into both).
[tool.hatch.build]
exclude = ["bench.conf", "agent.conf", ".dhands-bench", "hub.env", ".env.local", ".env.*.local"]

# The wheel carries the built web UI and the bench agent files (design 5.11).
# devicehands.infra.resources looks for them under devicehands/_resources/;
# a checkout (and the editable install `uv sync` makes) has no _resources/
# and falls back to docs/app and bench-py. tests/infra/test_resources.py
# keeps this mapping and the lookup in step.
[tool.hatch.build.targets.wheel]
only-include = ["src/devicehands", "docs/app", "bench-py"]
# Editable installs: put src/ on sys.path. Needed because hatch cannot
# build an editable install by itself when `sources` adds a prefix.
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"docs/app" = "devicehands/_resources/web"
"bench-py" = "devicehands/_resources/bench"

# ─────────────────────────────────────────────
# uv dependency groups (PEP 735)
# ─────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyserial",
    "pre-commit>=3.6.0",
    "import-linter>=2.0",
]

# ─────────────────────────────────────────────
# Ruff (lint + format)
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async 最佳实践
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length (ruff format 管)
    "B008",     # function call in default (Typer 习惯用法)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
# main.py imports every subcommand module AFTER load_env_files(), on purpose:
# the sub-apps read env at import time (typer envvar=), so loading .env first
# is what makes those defaults work. Flagging that as E402 forever just
# trains people to ignore the linter on this file.
"src/devicehands/cli/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────
# Mypy (type checking)
# ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
pretty = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["serial.*", "serial_asyncio.*", "mcp.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=devicehands",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "integration: integration tests requiring a real device",
    "slow: slow tests (> 5s)",
    "mcp: MCP protocol tests",
    "cli: CLI smoke tests",
]

[tool.coverage.run]
branch = true
source = ["src/devicehands"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
