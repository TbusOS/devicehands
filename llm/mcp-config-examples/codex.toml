# OpenAI Codex CLI MCP configuration for DeviceHands.
#
# Easiest: run this once from your checkout and Codex writes the block below
# into ~/.codex/config.toml (checked with codex-cli 0.159.2):
#
#   codex mcp add devicehands -- uv run --project "$PWD" dhands-mcp
#
# Or paste the block into ~/.codex/config.toml by hand and replace the path.

[mcp_servers.devicehands]
command = "uv"
args = ["run", "--project", "/path/to/devicehands", "dhands-mcp"]

[mcp_servers.devicehands.env]
DHANDS_WORKSPACE = "~/dhands-workspace"
